[project]
name = "facelab"
version = "0.2.0"
description = "Standalone harness for testing face-detection models and storing structured results."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
    "pydantic-settings==2.16.2",
    "numpy==1.26.4",
    "pillow==13.0.0",
    "onnxruntime==1.31.1",
    "insightface==2.1",
]

[tool.uv]
# FaceLab is an application, not a library: sync dependencies only, don't try to
# build and install the project itself.
package = false

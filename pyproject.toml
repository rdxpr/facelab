[project]
name = "facelab"
version = "0.3.0"
description = "Multi-model face-detection & recognition benchmarking harness for classroom attendance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
    "pydantic-settings==2.16.2",
    "numpy==1.26.4",
    "scipy==1.17.1",
    "pillow==13.0.0",
    "onnxruntime-gpu==1.31.1",
    "insightface==2.1",
    # UniFace provides the AdaFace / EdgeFace / SphereFace recognizers and the
    # eDifFIQA quality / 6D head-pose predictors. It is part of the runtime here.
    "uniface[gpu]>=4.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff>=0.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the classic default set: pycodestyle errors, plus Pyflakes (unused
# imports/variables, undefined names). The broad default set in newer Ruff
# releases flags pre-existing intentional patterns (blind excepts, etc.).
select = ["E4", "E7", "E9", "F"]

[tool.uv]
# FaceLab is an application, not a library: sync dependencies only, don't try to
# build and install the project itself.
package = false

# InsightFace declares a hard dependency on the CPU `onnxruntime` distribution.
# The GPU distribution provides the same `onnxruntime` module, so keep the CPU
# wheel out of the environment when using `onnxruntime-gpu`.
override-dependencies = ["onnxruntime; python_version < '0'"]
